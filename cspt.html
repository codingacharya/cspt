fig, ax = plt.subplots(1, 2, figsize=(10, 4))

    code:`import numpy as np, pandas as pd
from sklearn.compose import ColumnTransformer
from sklearn.pipeline import Pipeline
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import StandardScaler, OneHotEncoder
from sklearn.feature_selection import RFE
from sklearn.linear_model import LogisticRegression
from sklearn.model_selection import cross_val_score

rng = np.random.default_rng(0); n = 1000
df = pd.DataFrame({"income": rng.normal(50000, 15000, n),
                   "age": rng.integers(21, 65, n).astype(float),
                   "loan": rng.normal(10000, 4000, n),
                   "purpose": rng.choice(["car", "home", "edu"], n)})
df.loc[rng.choice(n, 80), "income"] = np.nan                      # missing values
y = (df["loan"] / df["income"].fillna(50000) + rng.normal(0, .05, n) > 0.25).astype(int)

num, cat = ["income", "age", "loan"], ["purpose"]
pre = ColumnTransformer([
    ("num", Pipeline([("imp", SimpleImputer(strategy="median", add_indicator=True)),
                      ("sc", StandardScaler())]), num),
    ("cat", OneHotEncoder(handle_unknown="ignore"), cat)])

pipe = Pipeline([("pre", pre),
                 ("rfe", RFE(LogisticRegression(max_iter=500), n_features_to_select=4)),

print("CV AUC:", cross_val_score(pipe, df, y, cv=5, scoring="roc_auc").mean())`,

    code:`# pip install optuna xgboost
import optuna
from sklearn.datasets import make_classification
from sklearn.model_selection import cross_val_score, train_test_split
from xgboost import XGBClassifier

X, y = make_classification(n_samples=2000, weights=[0.8, 0.2], random_state=0)
X_tr, X_te, y_tr, y_te = train_test_split(X, y, stratify=y, random_state=0)

def objective(trial):
    params = dict(
        n_estimators=trial.suggest_int("n_estimators", 100, 600),
        max_depth=trial.suggest_int("max_depth", 2, 8),
        learning_rate=trial.suggest_float("learning_rate", 0.01, 0.3, log=True),
        subsample=trial.suggest_float("subsample", 0.6, 1.0),
        colsample_bytree=trial.suggest_float("colsample_bytree", 0.6, 1.0))
    model = XGBClassifier(**params, eval_metric="logloss")
    return cross_val_score(model, X_tr, y_tr, cv=3, scoring="f1").mean()

  /* ---------- DIAGRAMS & APPLICATIONS (keyed by topic title) ---------- */
  var BLUE = "#2457c5", ORG = "#e07a1f", GRN = "#2a9d5c", GRY = "#8a97a6";
  function rnd(seed) { return function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }
  function box(s) { var p = String(s).split("|"); return '<div class="dbox"><b>' + p[0] + '</b>' + (p[1] ? '<small>' + p[1] + '</small>' : '') + '</div>'; }
  function svg(inner, cap, h) {
    return '<svg viewBox="0 0 340 ' + (h || 220) + '" class="dsvg" role="img" aria-label="' + (cap || "diagram") + '">' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#51606f"/></marker></defs>' + inner + '</svg>';
  }
  function dots(arr, col) { return $.map(arr, function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="' + col + '" opacity=".85"/>'; }).join(""); }
  function cloud(r, cx, cy, sp, n) { var a = []; for (var i = 0; i < n; i++) a.push([cx + (r() - .5) * 2 * sp, cy + (r() - .5) * 2 * sp]); return a; }
  var AX = '<path d="M25 200 H325 M25 200 V15" stroke="#9aa5b1" fill="none"/>';
  function ln(x1, y1, x2, y2, c, w, dash, arrow) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c + '" stroke-width="' + (w || 2) + '"' + (dash ? ' stroke-dasharray="5 4"' : '') + (arrow ? ' marker-end="url(#ah)"' : '') + '/>'; }
  function txt(x, y, s, c, sz, anchor) { return '<text x="' + x + '" y="' + y + '" font-size="' + (sz || 11) + '" fill="' + (c || "#1c2733") + '" text-anchor="' + (anchor || "middle") + '">' + s + '</text>'; }

  var D = {
    flow: function (d) { return '<div class="dflow">' + $.map(d.s, function (x) { return box(x); }).join('<span class="darr">&#10140;</span>') + '</div>'; },
    branch: function (d) { return '<div class="dbranch">' + box(d.r) + '<div class="darr down">&#9660;</div><div class="dkids">' + $.map(d.s, function (x) { return box(x); }).join("") + '</div></div>'; },
    net: function (d) {
      var L = d.s, W = 340, H = 210, xs = [], lines = "", circ = "";
      $.each(L, function (i, n) { var x = 40 + i * (W - 80) / (L.length - 1), col = []; for (var j = 0; j < n; j++) col.push([x, 25 + (j + .5) * (H - 50) / n]); xs.push(col); });
      for (var i = 0; i < xs.length - 1; i++) $.each(xs[i], function (_, a) { $.each(xs[i + 1], function (_, b) { lines += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#b9c4d3"/>'; }); });
      $.each(xs, function (i, col) { var c = i === 0 ? BLUE : i === xs.length - 1 ? ORG : GRN; $.each(col, function (_, p) { circ += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="9" fill="' + c + '"/>'; }); });
      var lab = txt(xs[0][0][0], 205, "Input", GRY) + txt(xs[xs.length - 1][0][0], 205, "Output", GRY) + txt(W / 2, 205, "Hidden", GRY);
      return svg(lines + circ + lab, "Neural network layers", 215);
    },
    tree: function (d) {
      var P = [[170, 28], [90, 88], [250, 88], [50, 152], [130, 152], [210, 152], [290, 152]], E = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]], o = "";
      $.each(E, function (_, e) { if (d.s[e[0]] && d.s[e[1]]) o += ln(P[e[0]][0], P[e[0]][1] + 12, P[e[1]][0], P[e[1]][1] - 12, GRY, 1.5); });
      $.each(P, function (i, p) { if (!d.s[i]) return; var leaf = i > 2 || (!d.s[2 * i + 1] && !d.s[2 * i + 2]);
        o += '<rect x="' + (p[0] - 40) + '" y="' + (p[1] - 13) + '" width="80" height="26" rx="6" fill="' + (leaf ? "#fdeedd" : "#e8eef9") + '" stroke="' + (leaf ? ORG : BLUE) + '"/>' + txt(p[0], p[1] + 4, d.s[i], null, 9.5); });
      o += txt(110, 62, "yes", GRY, 9) + txt(230, 62, "no", GRY, 9);
      return svg(o, "Decision tree", 180);
    },
    graph: function (d) {
      var o = "";
      $.each(d.e, function (_, e) { var a = d.n[e[0]], b = d.n[e[1]], dx = b[1] - a[1], dy = b[2] - a[2], t = Math.min(dx ? 36 / Math.abs(dx) : 9, dy ? 15 / Math.abs(dy) : 9);
        o += ln(a[1] + dx * t, a[2] + dy * t, b[1] - dx * t, b[2] - dy * t, "#51606f", 1.5, false, true); });
      $.each(d.n, function (_, n) { var c = n[3] === "o" ? ORG : BLUE;
        o += '<rect x="' + (n[1] - 34) + '" y="' + (n[2] - 13) + '" width="68" height="26" rx="13" fill="' + (n[3] === "o" ? "#fdeedd" : "#e8eef9") + '" stroke="' + c + '"/>' + txt(n[1], n[2] + 4, n[0], null, 10.5); });
      return svg(o, "Graphical model", d.h || 140);
    },
    scatter: function (d) {
      var r = rnd(7), o = AX, m = d.m, i, a, b, p;
      if (m === "line" || m === "margin") {
        a = cloud(r, 85, 155, 28, 16); b = cloud(r, 255, 65, 28, 16);
        o += dots(a, BLUE) + dots(b, ORG) + ln(130, 30, 210, 190, "#1c2733", 2.5);
        if (m === "margin") o += ln(112, 21, 192, 181, GRY, 1.5, true) + ln(148, 39, 228, 199, GRY, 1.5, true) + txt(250, 190, "margin", GRY, 10);
        else o += txt(240, 190, "decision boundary", GRY, 10);
      } else if (m === "reg" || m === "resid") {
        a = []; for (i = 0; i < 18; i++) { var x = 40 + i * 15.5, y = 175 - .55 * (x - 40) + (r() - .5) * 40; a.push([x, y]); if (m === "resid") o += ln(x, y, x, 175 - .55 * (x - 40), "#c0392b", 1, true); }
        o += ln(35, 178, 315, 24, "#1c2733", 2.5) + dots(a, BLUE) + txt(250, 190, m === "resid" ? "residuals" : "best-fit line", GRY, 10);
      } else if (m === "curve") {
        a = []; p = "M30,110"; for (i = 0; i <= 28; i++) { var xx = 30 + i * 10, yy = 110 - 60 * Math.sin(i / 28 * 2 * Math.PI); p += " L" + xx + "," + yy; if (i % 3 === 0) a.push([xx, yy + (r() - .5) * 24]); }
        o += '<path d="' + p + '" fill="none" stroke="' + ORG + '" stroke-width="2.5"/>' + dots(a, BLUE) + txt(250, 25, "smooth fit", GRY, 10);
      } else if (m === "clusters" || m === "gmm") {
        var C = [[80, 150, BLUE], [250, 150, ORG], [170, 55, GRN]];
        $.each(C, function (_, c) { o += dots(cloud(r, c[0], c[1], 22, 14), c[2]);
          o += m === "gmm" ? '<ellipse cx="' + c[0] + '" cy="' + c[1] + '" rx="42" ry="30" fill="none" stroke="' + c[2] + '" stroke-dasharray="4 3" stroke-width="1.5"/>'
                           : txt(c[0], c[1] + 5, "&#10005;", "#1c2733", 18); });
      } else if (m === "knn") {
        o += dots(cloud(r, 115, 140, 34, 18), BLUE) + dots(cloud(r, 225, 80, 34, 18), ORG) +
             '<circle cx="170" cy="110" r="48" fill="none" stroke="' + GRN + '" stroke-dasharray="5 4" stroke-width="2"/>' + txt(170, 115, "&#9733;", GRN, 20) + txt(250, 190, "k nearest neighbours", GRY, 10);
      } else if (m === "proj" || m === "lda") {
        for (i = 0; i < 26; i++) { var t = (r() - .5) * 2, n = (r() - .5) * 26, cls = m === "lda" && i % 2, off = cls ? 28 : -10;
          o += dots([[170 + t * 100 - (n + off) * .4, 110 - t * 42 + (n + off) * .9]], m === "lda" ? (cls ? ORG : BLUE) : BLUE); }
        o += m === "lda" ? ln(120, 170, 220, 50, "#1c2733", 2.5, false, true) + txt(236, 48, "LD1", null, 11)
                         : ln(170, 110, 290, 60, "#1c2733", 2.5, false, true) + ln(170, 110, 195, 165, "#c0392b", 2, false, true) + txt(300, 58, "PC1", null, 11) + txt(205, 178, "PC2", "#c0392b", 11);
      } else if (m === "bell") {
        p = "M30,200"; for (i = 0; i <= 56; i++) { var gx = 30 + i * 5, gy = 200 - 165 * Math.exp(-.5 * Math.pow((gx - 170) / 50, 2)); p += " L" + gx + "," + gy; }
        o += '<path d="' + p + ' L310,200 Z" fill="#e8eef9" stroke="' + BLUE + '" stroke-width="2"/>' + ln(120, 200, 120, 80, GRY, 1.5, true) + ln(220, 200, 220, 80, GRY, 1.5, true) + ln(170, 200, 170, 35, "#1c2733", 1.5, true) +
             txt(170, 215, "&mu;", null, 12) + txt(170, 130, "68% within &plusmn;1&sigma;", BLUE, 10);
      }
      return svg(o, "Chart", 225);
    }
  };

  /* ---------- RENDER ---------- */
  var current = 0;

  function buildMenu(filter) {
    var html = "", lastUnit = "";
    $.each(T, function (i, t) {
      if (filter && (t.title + ' ' + t.wk).toLowerCase().indexOf(filter) === -1) return;
      if (t.unit !== lastUnit) { html += '<div class="unit">' + t.unit + '</div>'; lastUnit = t.unit; }
      html += '<button class="topic' + (i === current ? ' active' : '') + '" data-i="' + i + '">' + t.wk.replace("Week ", "W") + ' · ' + t.title + '</button>';
    });
    $("#menu").html(html || '<p class="small text-muted mt-3">No topic found.</p>');
  }

  function show(i) {
    current = i;
    var t = T[i];
    var theory = $.map(t.theory, function (p) { return "<li>" + p + "</li>"; }).join("");
    var libs = $.map(t.libs, function (l) { return "<span>" + l + "</span>"; }).join("");
    var params = $.map(t.params, function (p) {
      return "<tr><td>" + $("<i>").text(p[0]).html() + "</td><td>" + p[1] + "</td></tr>";
    }).join("");

    var ex = EXTRA[t.title] || {}, diagram = "", apps = "";
    if (ex.d && D[ex.d.t]) diagram = '<div class="panel mb-3"><h3 class="h5">Diagram</h3>' + D[ex.d.t](ex.d) +
      (ex.d.cap ? '<p class="dcap">' + ex.d.cap + '</p>' : '') + '</div>';
    var alt = ex.alt ? '<div class="panel mt-3"><h3 class="h5">Other good options</h3><ul class="apps mb-0">' +
      $.map(ex.alt, function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul></div>' : "";
    if (ex.a) apps = '<div class="panel mt-3"><h3 class="h5">Real-world applications</h3><ul class="apps mb-0">' +
      $.map(ex.a, function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul></div>';

    $("#content").html(
      '<div class="panel mb-3"><div class="meta"><span>' + t.wk + '</span><span>' + t.sess + '</span></div><h2 class="h4">' + t.title + '</h2>' +
        '<ul class="mb-2">' + theory + '</ul><p class="lab mb-0"><b>Lab project:</b> ' + t.lab + '</p></div>' + diagram +
      '<div class="panel">' +
        '<h3 class="h5">Python code</h3>' +
        '<div class="libs mb-2"><small class="text-muted me-2">Libraries:</small>' + libs + '</div>' +
        '<div class="codebar d-flex justify-content-between"><span>python</span>' +
          '<button id="copy" class="btn btn-sm btn-outline-light py-0">Copy</button></div>' +
        '<pre><code class="language-python"></code></pre>' +
        '<h3 class="h6 mt-3">Important parameters</h3>' +
        '<table class="table table-sm params mb-0"><tbody>' + params + '</tbody></table>' +
      '</div>' + apps + alt
    );
    $("#content pre code").text(t.code);
    hljs.highlightElement($("#content pre code")[0]);
    buildMenu($("#search").val().toLowerCase());
    $("#prev").prop("disabled", i === 0);
    $("#next").prop("disabled", i === T.length - 1);
    location.hash = "t" + i;
    window.scrollTo({ top: 0 });
  }

  $("#menu").on("click", ".topic", function () { show($(this).data("i")); });
  $("#search").on("input", function () { buildMenu($(this).val().toLowerCase()); });
  $("#prev").on("click", function () { if (current > 0) show(current - 1); });
  $("#next").on("click", function () { if (current < T.length - 1) show(current + 1); });
  $("#content").on("click", "#copy", function () {
    var btn = $(this), text = T[current].code;
    var done = function () { btn.text("Copied"); setTimeout(function () { btn.text("Copy"); }, 1200); };
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done); }
    else { var ta = $("<textarea>").val(text).appendTo("body").select(); document.execCommand("copy"); ta.remove(); done(); }
  });

  var start = parseInt((location.hash || "").replace("#t", ""), 10);
  show(isNaN(start) || !T[start] ? 0 : start);
});
</script>
</body>
